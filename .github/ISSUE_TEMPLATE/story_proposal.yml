name: 剧情建议 / 补白提案
description: 在动手写主线补白或二创前，先沟通设定与归属
title: "[提案] "
labels: ["proposal", "writing"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 故事概要
      description: 你想补充谁、什么时间、什么事件？
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: 归属
      options:
        - "主线补白（不改变既有事实）"
        - "独立二创（同人图 / 音频 / 代码工具）"
        - "其他 / 不确定"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 是否改变既有事实
      description: 如果与现有正文冲突，请说明冲突点和处理方式。
  - type: checkboxes
    id: license
    attributes:
      label: 授权确认
      options:
        - label: "我确认内容为原创或已获授权，并同意按 CC BY-SA 4.0 发布。"
          required: true
